name: Sync GitHub issues to Jira
on:
  issues:
    # Only the event types the sync action handles. Others (e.g. status_changed)
    # fall through to an "Update" webhook call, which races the "Create" from the
    # labeled event and produces duplicate Jira issues.
    types: [opened, edited, labeled, unlabeled, assigned, unassigned, closed, reopened, deleted]
  issue_comment:

permissions:
  contents: read

jobs:
  sync-issues:
    name: Sync issues to Jira
    runs-on: ubuntu-22.04
    steps:
      - uses: ikethecoder/sync-issues-github-jira@dev
        with:
          webhook-url: ${{ secrets.JIRA_WEBHOOK_URL }}

  cleanup-runs:
    name: Delete workflow runs
    runs-on: ubuntu-latest
    permissions:
      actions: write    
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 5
          delete_workflow_pattern: jira.yaml
